; Floor Piano — builds for both ESP8266 (NodeMCU) and ESP32-S3.
;   pio run -e nodemcuv2     /  pio run -e esp32-s3
;   pio run -e <env> -t upload      (firmware)
;   pio run -e <env> -t uploadfs    (web app / LittleFS)

[env]
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    bblanchon/ArduinoJson @ ^7.3.1

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
board_build.f_cpu = 160000000L
upload_speed = 921600
lib_deps =
    ${env.lib_deps}
    ottowinter/ESPAsyncWebServer-esphome @ ^3.3.23
    me-no-dev/ESPAsyncTCP @ ^1.2.2

[env:esp32-s3]
platform = espressif32
board = seeed_xiao_esp32s3        ; Seeed XIAO ESP32-S3 (8 MB flash QSPI, no PSRAM)
upload_speed = 921600
board_build.f_cpu = 240000000L          ; run the CPU flat out
; XIAO ESP32-S3 has 8 MB flash — use the matching layout: 3.3 MB app + 1.4 MB FS.
; (min_spiffs.csv would work but wastes 4 MB and could confuse the bootloader.)
board_build.partitions = default_8MB.csv
; Make any future crash dump auto-decode into file:line in `pio device monitor`.
monitor_filters = esp32_exception_decoder
build_flags =
    -O2                                  ; optimise for speed (default is -Os)
    -DCORE_DEBUG_LEVEL=0                 ; no Arduino core logging overhead
    -DCONFIG_ASYNC_TCP_USE_WDT=0        ; saves 33-200us per TCP event
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=1   ; pin the TCP task to the app core (priority 3)
    -DFP_BLE_ENABLED                    ; gates the BLE output module
    ; BLE init (BLEDevice::init → BLE controller setup) needs ~12-16 KB of stack;
    ; the Arduino loop task defaults to 8 KB which overflows partway and aborts.
    ; Bumping the loop stack avoids the abort when "Start BLE" is invoked from
    ; the WS handler (which runs in loop context). 16 KB still leaves ~300 KB DRAM.
    -DARDUINO_LOOP_STACK_SIZE=16384
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=16384
    ; Switch BleKeyboard to NimBLE. Bluedroid was unstable under WiFi+BLE coex
    ; (Android wouldn't connect, Windows paired but kept dropping). NimBLE handles
    ; coex cleanly, accepts Windows pairing without security-profile workarounds,
    ; and uses ~150 KB less flash. BLE-MIDI is also switched to its NimBLE backend
    ; (hardware/BLEMIDI_ESP32_NimBLE.h in ble_out.cpp) so both libraries share the
    ; same BLE stack — only one BLE stack can be active at a time.
    -DUSE_NIMBLE
; ArduinoBLE is pulled in as a transitive dep of Arduino-BLE-MIDI but conflicts
; with the ESP32 BLEDevice library (redefinition of class BLEDescriptor). We use
; the ESP32 BLEDevice path explicitly, so ignore ArduinoBLE.
lib_ignore = ArduinoBLE
lib_deps =
    ${env.lib_deps}
    esphome/ESPAsyncWebServer-esphome @ ^3.3.0
    esphome/AsyncTCP-esphome @ ^2.1.4
    h2zero/NimBLE-Arduino @ ^1.4.1       ; shared BLE stack for keyboard + MIDI
    t-vk/ESP32 BLE Keyboard @ ^0.3.2     ; BLE HID keyboard (NimBLE via -DUSE_NIMBLE)
    fortyseveneffects/MIDI Library @ ^5.0.2
    https://github.com/lathoub/Arduino-BLE-MIDI.git  ; BLE-MIDI transport (not on PIO registry)
